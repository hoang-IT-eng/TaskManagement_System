<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Task Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Language Switcher -->
  <div style="position: fixed; top: 20px; right: 20px; z-index: 1001;">
    <div id="languageSwitcher"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title" data-i18n="auth.forgotPassword">Forgot Password?</h1>
        <p class="auth-subtitle">No worries, we'll send you reset instructions</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Send Reset Link
          </button>
        </div>

        <div class="auth-footer">
          <p>
            Remember your password?
            <a href="index.html" class="font-semibold">Sign In</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Ensure language switcher is initialized
    if (typeof I18n !== 'undefined') {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          I18n.initLanguageSwitcher();
          I18n.updateLanguageSwitcher();
        });
      } else {
        I18n.initLanguageSwitcher();
        I18n.updateLanguageSwitcher();
      }
    }

    // If already logged in, redirect to dashboard
    if (Auth.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');

    forgotPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();

      try {
        Utils.showLoading();
        await api.post('/auth/forgot-password', { email });
        Utils.hideLoading();
        
        Utils.showAlert('Password reset link sent! Check your email.', 'success');
        
        // Show success message
        document.querySelector('.auth-card').innerHTML = `
          <div class="auth-header">
            <div class="auth-logo">✅</div>
            <h1 class="auth-title">Check Your Email</h1>
            <p class="auth-subtitle">
              We've sent a password reset link to <strong>${email}</strong>
            </p>
          </div>
          
          <div style="text-align: center; padding: 2rem 0;">
            <p style="color: var(--gray-600); margin-bottom: 1.5rem;">
              Didn't receive the email? Check your spam folder or try again.
            </p>
            <a href="index.html" class="btn btn-primary btn-lg">
              Back to Login
            </a>
          </div>
        `;
      } catch (error) {
        Utils.hideLoading();
        Utils.showAlert(error.message || 'Failed to send reset link. Please try again.', 'danger');
      }
    });
  </script>
</body>
</html>
