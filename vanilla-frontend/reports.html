<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Task Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="dashboard.html" class="navbar-brand" data-i18n="nav.taskManage">📋 SmartWork</a>
      <ul class="navbar-menu">
        <li><a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a></li>
        <li><a href="projects.html" data-i18n="nav.projects">Projects</a></li>
        <li><a href="teams.html" data-i18n="nav.teams">Teams</a></li>
        <li><a href="reports.html" data-i18n="nav.reports">Reports</a></li>
        <li id="adminMenuItem" class="hidden"><a href="admin.html" data-i18n="nav.admin">Admin</a></li>
      </ul>
      <div class="navbar-user">
        <div id="languageSwitcher"></div>
        <div class="navbar-avatar" id="userAvatar"></div>
        <span id="userName"></span>
        <button class="btn btn-sm btn-secondary" onclick="Auth.logout()" data-i18n="common.logout">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
    <div class="page-header">
      <h1 class="page-title" data-i18n="reports.title">📊 Reports & Analytics</h1>
      <p class="page-subtitle" data-i18n="reports.subtitle">View statistics and insights</p>
    </div>

    <!-- Overall Statistics -->
    <div class="card">
      <div class="card-header" data-i18n="reports.overallStatistics">Overall Statistics</div>
      <div class="grid grid-4">
        <div class="stat-card">
          <div class="stat-value" id="totalProjectsCount">-</div>
          <div class="stat-label" data-i18n="reports.totalProjects">Total Projects</div>
        </div>
        <div class="stat-card" style="border-color: var(--info)">
          <div class="stat-value" id="totalTasksCount">-</div>
          <div class="stat-label" data-i18n="reports.totalTasks">Total Tasks</div>
        </div>
        <div class="stat-card" style="border-color: var(--success)">
          <div class="stat-value" id="completedTasksCount">-</div>
          <div class="stat-label" data-i18n="reports.completedTasks">Completed Tasks</div>
        </div>
        <div class="stat-card" style="border-color: var(--warning)">
          <div class="stat-value" id="completionRate">-</div>
          <div class="stat-label">Completion Rate</div>
        </div>
      </div>
    </div>

    <!-- Project Statistics -->
    <div class="card">
      <div class="card-header" data-i18n="reports.projectStatistics">Project Statistics</div>
      <div id="projectStatsContainer">
        <div class="flex-center" style="padding: 3rem;">
          <div class="loading"></div>
        </div>
      </div>
    </div>

    <!-- Tasks by Status -->
    <div class="grid grid-2">
      <div class="card">
        <div class="card-header" data-i18n="reports.byStatus">Tasks by Status</div>
        <div id="tasksByStatus">
          <div class="flex-center" style="padding: 2rem;">
            <div class="loading"></div>
          </div>
        </div>
      </div>

      <!-- Tasks by Priority -->
      <div class="card">
        <div class="card-header" data-i18n="reports.byPriority">Tasks by Priority</div>
        <div id="tasksByPriority">
          <div class="flex-center" style="padding: 2rem;">
            <div class="loading"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Require authentication
    Auth.requireAuth();

    // Ensure language switcher is initialized
    if (typeof I18n !== 'undefined') {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          I18n.initLanguageSwitcher();
          I18n.updateLanguageSwitcher();
        });
      } else {
        I18n.initLanguageSwitcher();
        I18n.updateLanguageSwitcher();
      }
    }

    // Display user info
    const user = Auth.getCurrentUser();
    document.getElementById('userName').textContent = user.fullName;
    document.getElementById('userAvatar').textContent = Utils.getUserInitials(user.fullName);

    // Show admin menu if user is admin
    if (Auth.isAdmin()) {
      document.getElementById('adminMenuItem').classList.remove('hidden');
    }

    // Load reports data
    async function loadReports() {
      try {
        const projectStats = await api.getMyProjectsStatistics();
        displayOverallStats(projectStats);
        displayProjectStats(projectStats);
        displayTasksByStatus(projectStats);
        displayTasksByPriority(projectStats);
      } catch (error) {
        console.error('Failed to load reports:', error);
        Utils.showAlert('Failed to load reports data', 'danger');
      }
    }

    function displayOverallStats(projectStats) {
      const totalProjects = projectStats.length;
      const totalTasks = projectStats.reduce((sum, stat) => sum + stat.totalTasks, 0);
      const completedTasks = projectStats.reduce((sum, stat) => sum + stat.completedTasks, 0);
      const completionRate = totalTasks > 0 ? ((completedTasks / totalTasks) * 100).toFixed(1) : 0;

      document.getElementById('totalProjectsCount').textContent = totalProjects;
      document.getElementById('totalTasksCount').textContent = totalTasks;
      document.getElementById('completedTasksCount').textContent = completedTasks;
      document.getElementById('completionRate').textContent = completionRate + '%';
    }

    function displayProjectStats(projectStats) {
      const container = document.getElementById('projectStatsContainer');
      
      if (projectStats.length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No project data available</p>';
        return;
      }

      container.innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Project Name</th>
              <th>Total Tasks</th>
              <th>Completed</th>
              <th>Completion Rate</th>
              <th>Status Breakdown</th>
            </tr>
          </thead>
          <tbody>
            ${projectStats.map(stat => `
              <tr>
                <td><strong>${Utils.escapeHtml(stat.projectName)}</strong></td>
                <td>${stat.totalTasks}</td>
                <td>${stat.completedTasks}</td>
                <td>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <div style="flex: 1; height: 8px; background: var(--gray-200); border-radius: 4px;">
                      <div style="height: 100%; width: ${stat.completionRate}%; background: var(--success); border-radius: 4px;"></div>
                    </div>
                    <span style="font-size: 0.875rem; font-weight: 600;">${stat.completionRate.toFixed(1)}%</span>
                  </div>
                </td>
                <td>
                  <div style="display: flex; gap: 0.25rem; flex-wrap: wrap;">
                    ${Object.entries(stat.tasksByStatus).map(([status, count]) => `
                      <span class="badge ${Utils.getStatusBadgeClass(status)}" style="font-size: 0.75rem;">
                        ${status}: ${count}
                      </span>
                    `).join('')}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function displayTasksByStatus(projectStats) {
      const container = document.getElementById('tasksByStatus');
      
      // Aggregate all tasks by status
      const statusCounts = {};
      projectStats.forEach(stat => {
        Object.entries(stat.tasksByStatus).forEach(([status, count]) => {
          statusCounts[status] = (statusCounts[status] || 0) + count;
        });
      });

      if (Object.keys(statusCounts).length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No task data available</p>';
        return;
      }

      const totalTasks = Object.values(statusCounts).reduce((sum, count) => sum + count, 0);

      container.innerHTML = `
        <div style="padding: 1rem;">
          ${Object.entries(statusCounts).map(([status, count]) => {
            const percentage = ((count / totalTasks) * 100).toFixed(1);
            return `
              <div style="margin-bottom: 1rem;">
                <div class="flex-between" style="margin-bottom: 0.25rem;">
                  <span class="font-semibold">${status}</span>
                  <span class="text-muted">${count} (${percentage}%)</span>
                </div>
                <div style="height: 8px; background: var(--gray-200); border-radius: 4px;">
                  <div style="height: 100%; width: ${percentage}%; background: var(--${getStatusColor(status)}); border-radius: 4px;"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function displayTasksByPriority(projectStats) {
      const container = document.getElementById('tasksByPriority');
      
      // Aggregate all tasks by priority
      const priorityCounts = {};
      projectStats.forEach(stat => {
        stat.tasksByPriority = stat.tasksByPriority || {};
        Object.entries(stat.tasksByPriority).forEach(([priority, count]) => {
          priorityCounts[priority] = (priorityCounts[priority] || 0) + count;
        });
      });

      if (Object.keys(priorityCounts).length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No priority data available</p>';
        return;
      }

      const totalTasks = Object.values(priorityCounts).reduce((sum, count) => sum + count, 0);

      container.innerHTML = `
        <div style="padding: 1rem;">
          ${Object.entries(priorityCounts).map(([priority, count]) => {
            const percentage = ((count / totalTasks) * 100).toFixed(1);
            return `
              <div style="margin-bottom: 1rem;">
                <div class="flex-between" style="margin-bottom: 0.25rem;">
                  <span class="font-semibold">${priority}</span>
                  <span class="text-muted">${count} (${percentage}%)</span>
                </div>
                <div style="height: 8px; background: var(--gray-200); border-radius: 4px;">
                  <div style="height: 100%; width: ${percentage}%; background: var(--${getPriorityColor(priority)}); border-radius: 4px;"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function getStatusColor(status) {
      const colors = {
        'Todo': 'secondary',
        'InProgress': 'primary',
        'InReview': 'info',
        'Done': 'success',
        'Cancelled': 'danger'
      };
      return colors[status] || 'secondary';
    }

    function getPriorityColor(priority) {
      const colors = {
        'Low': 'secondary',
        'Medium': 'info',
        'High': 'warning',
        'Urgent': 'danger',
        'Critical': 'danger'
      };
      return colors[priority] || 'secondary';
    }

    // Load reports on page load
    loadReports();
  </script>
</body>
</html>
